name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Organize project files
        run: |
          J=app/src/main/java/com/example/videoplayer
          R=app/src/main/res
          mkdir -p $J $R/layout $R/drawable $R/values
          mv_if() { if [ -f "$1" ]; then mv "$1" "$2/"; fi; }
          for f in MainActivity.kt PlayerActivity.kt VideoAdapter.kt Video.kt; do mv_if $f $J; done
          mv_if AndroidManifest.xml app/src/main
          for f in activity_main.xml activity_player.xml item_video.xml; do mv_if $f $R/layout; done
          for f in bg_badge.xml bg_top_gradient.xml; do mv_if $f $R/drawable; done
          mv_if themes.xml $R/values
          if [ ! -f build.gradle ]; then
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF
          fi
          if [ ! -f app/build.gradle ]; then
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.videoplayer'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.videoplayer"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation "androidx.core:core-ktx:1.13.1"
              implementation "androidx.appcompat:appcompat:1.7.0"
              implementation "androidx.activity:activity-ktx:1.9.0"
              implementation "com.google.android.material:material:1.12.0"
              implementation "androidx.recyclerview:recyclerview:1.3.2"
              implementation "androidx.media3:media3-exoplayer:1.3.1"
              implementation "androidx.media3:media3-ui:1.3.1"
              implementation "com.github.bumptech.glide:glide:4.16.0"
          }
          EOF
          fi

      - name: Save organized files to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Organize project files"
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: HM-Video-Player-APK
          path: app/build/outputs/apk/debug/app-debug.apk
