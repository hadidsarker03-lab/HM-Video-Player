plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.videoplayer'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.videoplayer"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.activity:activity-ktx:1.9.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "androidx.media3:media3-exoplayer:1.3.1"
    implementation "androidx.media3:media3-ui:1.3.1"
    implementation "androidx.media3:media3-session:1.3.1"
    implementation "androidx.media3:media3-transformer:1.3.1"
    implementation "com.google.guava:guava:32.1.3-android"
    implementation "com.github.bumptech.glide:glide:4.16.0"
}

// আগের আপলোডের যে পুরনো .kt ফাইল রিপোজিটরিতে রয়ে গেছে (kept-sources.txt-এ নেই),
// বিল্ডের আগে সেগুলো সরিয়ে দেয়, যাতে পুরনো ফিচারের ফাইল বিল্ড না ভাঙে।
tasks.register("removeStaleSources") {
    doLast {
        def listFile = file("kept-sources.txt")
        if (!listFile.exists()) return
        def keep = listFile.readLines().collect { it.trim() }.findAll { it }
        fileTree("src").matching { include "**/*.kt" }.each { f ->
            if (!keep.contains(f.name)) {
                println "Removing stale source: " + f.name
                f.delete()
            }
        }
    }
}
tasks.matching { it.name == "preBuild" }.configureEach { dependsOn("removeStaleSources") }

// আগের আপলোডের পুরনো স্প্ল্যাশ লোগো (যেগুলো নতুন জিপে নেই) রিপোজিটরি থেকে মুছে দেয়,
// যাতে পুরনো লোগো আর নতুনটাকে ঢেকে না দেয়।
tasks.register("removeStaleRes") {
    doLast {
        fileTree("src/main/res").matching {
            include "drawable*/splash_logo.*"
            include "mipmap-anydpi*/ic_launcher*.xml"
            include "drawable*/ic_launcher_foreground.*"
            include "drawable*/ic_launcher_background.*"
        }.each { f ->
            println "Removing stale resource: " + f.path
            f.delete()
        }
    }
}
tasks.matching { it.name == "preBuild" }.configureEach { dependsOn("removeStaleRes") }
