plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.videoplayer'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.videoplayer"
        minSdk 24
        targetSdk 35
        // GitHub Actions-এর রান নম্বর থেকে ভার্সন বাড়ে, তাই প্রতিটি বিল্ড আগেরটার ওপর আপডেট হিসেবে বসে
        def runNo = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
        versionCode runNo
        versionName "1.0.${runNo}"
        // আপডেট চেক করার রিপো: GitHub Actions-এ নিজে থেকে বসে
        buildConfigField "String", "UPDATE_REPO", "\"${System.getenv('GITHUB_REPOSITORY') ?: 'hadidsarker03-Lab/HM-Video-Player'}\""
    }

    buildFeatures {
        buildConfig true
    }

    // স্থায়ী সাইনিং কী: GitHub Secrets থেকে আসে (না থাকলে ডিবাগ কী দিয়ে সাইন হয়)
    def ksPath = System.getenv("KEYSTORE_FILE")
    def hasKs = ksPath != null && new File(ksPath).exists()
    signingConfigs {
        release {
            if (hasKs) {
                storeFile new File(ksPath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasKs ? signingConfigs.release : signingConfigs.debug
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

// পুরনো support লাইব্রেরি androidx-এর সাথে attr ডুপ্লিকেট করে, তাই বাদ দেওয়া হলো।
configurations.configureEach {
    exclude group: 'com.android.support'
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.activity:activity-ktx:1.9.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.4"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.viewpager2:viewpager2:1.1.0"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.squareup.okhttp3:okhttp-dnsoverhttps:4.12.0"
    implementation "androidx.media3:media3-exoplayer:1.5.1"
    implementation "androidx.media3:media3-ui:1.5.1"
    implementation "androidx.media3:media3-exoplayer-hls:1.5.1"
    implementation "androidx.media3:media3-exoplayer-dash:1.5.1"
    implementation "androidx.media3:media3-session:1.5.1"
    implementation "androidx.media3:media3-transformer:1.5.1"
    implementation "com.google.guava:guava:32.1.3-android"
    implementation "com.github.bumptech.glide:glide:4.16.0"
}

// আগের আপলোডের যে পুরনো .kt ফাইল রিপোজিটরিতে রয়ে গেছে (kept-sources.txt-এ নেই),
// বিল্ডের আগে সেগুলো সরিয়ে দেয়, যাতে পুরনো ফিচারের ফাইল বিল্ড না ভাঙে।
tasks.register("removeStaleSources") {
    doLast {
        def listFile = file("kept-sources.txt")
        if (!listFile.exists()) return
        def keep = listFile.readLines().collect { it.trim() }.findAll { it }
        fileTree("src").matching { include "**/*.kt" }.each { f ->
            if (!keep.contains(f.name)) {
                println "Removing stale source: " + f.name
                f.delete()
            }
        }
    }
}
tasks.matching { it.name == "preBuild" }.configureEach { dependsOn("removeStaleSources") }

// আগের আপলোডের যে পুরনো res ফাইল (values/*.xml, drawable, layout ইত্যাদি) রিপোজিটরিতে রয়ে গেছে
// (kept-res.txt-এ নেই), বিল্ডের আগে সেগুলো মুছে দেয়। এতে পুরনো ফাইলের কারণে
// "Duplicate value for resource" বা পুরনো লোগো/আইকন ঢেকে যাওয়ার সমস্যা হয় না।
tasks.register("removeStaleRes") {
    doLast {
        def listFile = file("kept-res.txt")
        if (!listFile.exists()) return
        def keep = listFile.readLines().collect { it.trim() }.findAll { it } as Set
        def resDir = file("src/main/res")
        fileTree(resDir).each { f ->
            def rel = resDir.toPath().relativize(f.toPath()).toString().replace("\\", "/")
            if (!keep.contains(rel)) {
                println "Removing stale resource: " + rel
                f.delete()
            }
        }
    }
}
tasks.matching { it.name == "preBuild" }.configureEach { dependsOn("removeStaleRes") }
